name: 'Salesforce: deploy'

# Deploys the Salesforce metadata and runs all Apex tests when salesforce/ changes on main.
# The agent itself is published separately (sf agent publish authoring-bundle), see docs/SETUP-GUIDE.md.
on:
  push:
    branches: [main]
    paths:
      - 'salesforce/force-app/**'
  workflow_dispatch:

concurrency:
  group: salesforce-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped until the org login is configured (docs/CI-CD.md)
    if: vars.SALESFORCE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: salesforce
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Salesforce's packaged CLI includes its dependencies, so it does not depend on the npm registry
      - name: Install Salesforce CLI
        run: |
          mkdir -p "$HOME/sf"
          curl -sSL https://developer.salesforce.com/media/salesforce-cli/sf/channels/stable/sf-linux-x64.tar.xz \
            | tar -xJ -C "$HOME/sf" --strip-components 1
          echo "$HOME/sf/bin" >> "$GITHUB_PATH"
          "$HOME/sf/bin/sf" --version

      - name: Log in
        env:
          SF_AUTH_URL: ${{ secrets.SF_AUTH_URL }}
        run: |
          [ -z "$SF_AUTH_URL" ] && { echo "::error::Secret SF_AUTH_URL is not set. See docs/CI-CD.md"; exit 1; }
          # Values piped in from PowerShell can carry a byte-order mark, quotes or a line break; keep only the URL
          printf '%s' "$SF_AUTH_URL" | tr -d '\r\n"' | sed 's/^\xEF\xBB\xBF//; s/^[[:space:]]*//; s/[[:space:]]*$//' > auth-url.txt
          grep -q '^force://' auth-url.txt || { echo "::error::SF_AUTH_URL must start with force:// (see docs/CI-CD.md)"; exit 1; }
          sf org login sfdx-url --sfdx-url-file auth-url.txt --alias orderintake --set-default
          rm auth-url.txt

      - name: Deploy and run Apex tests
        run: >
          sf project deploy start
          --source-dir force-app/main/default/classes
          --source-dir force-app/main/default/triggers
          --source-dir force-app/main/default/objects
          --source-dir force-app/main/default/layouts
          --source-dir force-app/main/default/permissionsets
          --source-dir force-app/main/default/genAiPromptTemplates
          --source-dir force-app/main/default/applications
          --source-dir force-app/main/default/tabs
          --test-level RunLocalTests
          --wait 30
