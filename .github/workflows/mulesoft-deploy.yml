# Reusable: builds a Mule app, runs its MUnit tests, publishes it to Exchange and deploys it to CloudHub 2.0.
# Called by mulesoft-email-ingest.yml and mulesoft-erp-api.yml. Setup: docs/CI-CD.md
name: MuleSoft deploy (reusable)

on:
  workflow_call:
    inputs:
      app:
        description: Folder under mulesoft/
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mulesoft/${{ inputs.app }}
    env:
      ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
      ANYPOINT_ORG_ID: ${{ vars.ANYPOINT_ORG_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check configuration
        working-directory: .
        run: |
          missing=""
          [ -z "$ANYPOINT_CLIENT_ID" ] && missing="$missing ANYPOINT_CLIENT_ID(secret)"
          [ -z "$ANYPOINT_CLIENT_SECRET" ] && missing="$missing ANYPOINT_CLIENT_SECRET(secret)"
          [ -z "$ANYPOINT_ORG_ID" ] && missing="$missing ANYPOINT_ORG_ID(variable)"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing. See docs/CI-CD.md"; exit 1; fi

      # Exchange credentials for the connected app
      - name: Maven settings
        working-directory: .
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>~~~Client~~~</username>
                <password>${env.ANYPOINT_CLIENT_ID}~?~${env.ANYPOINT_CLIENT_SECRET}</password>
              </server>
            </servers>
          </settings>
          XML

      # Exchange assets belong to the organization (groupId = org ID) and need a new version every publish
      - name: Set Exchange group and version
        run: |
          sed -i "0,/<groupId>com.osf.demo<\/groupId>/s//<groupId>${ANYPOINT_ORG_ID}<\/groupId>/" pom.xml
          mvn -B -q versions:set -DnewVersion=1.${{ github.run_number }}.${{ github.run_attempt }} -DgenerateBackupPoms=false

      - name: Secure properties for ${{ inputs.app }}
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          ERP_API_KEY: ${{ secrets.ERP_API_KEY }}
        run: |
          case "${{ inputs.app }}" in
            email-idp-ingest-sys-api)
              names="EMAIL_PASSWORD SF_CLIENT_ID SF_CLIENT_SECRET OCR_API_KEY"
              args="-Demail.password=$EMAIL_PASSWORD -Dsf.clientId=$SF_CLIENT_ID -Dsf.clientSecret=$SF_CLIENT_SECRET -Docr.apiKey=$OCR_API_KEY" ;;
            order-intake-erp-api)
              names="ODOO_API_KEY ERP_API_KEY"
              args="-Dodoo.apiKey=$ODOO_API_KEY -Dapi.key=$ERP_API_KEY" ;;
          esac
          for n in $names; do [ -z "${!n}" ] && { echo "::error::Secret $n is not set. See docs/CI-CD.md"; exit 1; }; done
          echo "SECURE_ARGS=$args" >> "$GITHUB_ENV"

      # CloudHub 2.0 deploys from Exchange: "mvn deploy" publishes the app, "mvn deploy -DmuleDeploy" deploys it
      - name: Test and publish to Exchange
        run: mvn -B deploy -Danypoint.orgId="$ANYPOINT_ORG_ID"

      - name: Deploy to CloudHub 2.0
        run: >
          mvn -B deploy -DmuleDeploy -DskipMunitTests
          -Danypoint.orgId="$ANYPOINT_ORG_ID"
          -Danypoint.clientId="$ANYPOINT_CLIENT_ID"
          -Danypoint.clientSecret="$ANYPOINT_CLIENT_SECRET"
          -Danypoint.environment="${{ vars.ANYPOINT_ENVIRONMENT || 'Sandbox' }}"
          -Danypoint.target="${{ vars.ANYPOINT_TARGET || 'Cloudhub-US-East-2' }}"
          -Danypoint.muleVersion="${{ vars.MULE_VERSION || '4.13.1' }}"
          -Danypoint.releaseChannel="${{ vars.MULE_RELEASE_CHANNEL || 'EDGE' }}"
          $SECURE_ARGS
