# Order Intake email ingest - dev (Agentforce hackathon demo)
# Secrets are NOT stored here. Supply them as VM arguments in Studio
# (-M-Demail.password=... etc.) or as hidden properties in Runtime Manager:
#   email.password    Gmail App Password for the orders mailbox
#   sf.clientId       Salesforce External Client App consumer key (client credentials flow)
#   sf.clientSecret   Salesforce External Client App consumer secret
#   ocr.apiKey        Azure AI Document Intelligence key (KEY 1 of the resource)

# Gmail (IMAP). Gmail labels appear as IMAP folders.
email.host=imap.gmail.com
email.port=993
email.username=demo.orders.po@gmail.com
email.folder=Orders
email.folder.processed=Processed
email.folder.notOrder=Not-Order
email.folder.review=Needs-Review
email.pollSeconds=60
# Gmail drops idle IMAP connections; moving the email to its result label is retried on a fresh connection
email.moveRetries=3
email.moveRetryMillis=2000
# Gmail (SMTP) for the order confirmation reply, same account and App Password
email.smtp.host=smtp.gmail.com
email.smtp.port=465

# Salesforce
sf.host=orgfarm-d621d6fe72-dev-ed.develop.my.salesforce.com
sf.apiVersion=v65.0
sf.classifyTemplate=Classify_Order_Email
# Reads the PO from the email body (every purchase order)
sf.extractTemplate=Extract_Order_From_Email
# Reads the text of an attached Word or Excel PO (Azure layout model output in Document_Text__c)
sf.extractDocumentTemplate=Extract_Order_From_Document

# Clean purchase orders (no exceptions) become Salesforce orders straight away and the customer gets a reply
order.autoCreate=true
# Orders created that way go straight to the ERP (Salesforce /orderintake/v1/erp-submit); the customer reply
# then waits for the ERP order number, and an ERP rejection (e.g. credit limit) goes to review instead
order.autoSubmitErp=true

# Azure AI Document Intelligence: every purchase order PDF is read with the prebuilt invoice model
ocr.host=oi-docprocessing.cognitiveservices.azure.com
ocr.model=prebuilt-invoice
# Word, Excel, PowerPoint and HTML attachments (not accepted by the invoice model)
ocr.officeModel=prebuilt-layout
ocr.apiVersion=2024-11-30
ocr.pollMillis=2000
ocr.maxPolls=30
